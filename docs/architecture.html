<title>Promo Finder Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root {
  --bg: #F7F8F7;
  --fg: #16201F;
  --muted: #56625F;
  --line: #C9D1CE;
  --surface: #FFFFFF;
  --arrow: #4A5653;
  --llm: #0B7A72;
  --llm-tint: #E3F2F0;
  --llm-band: #F0F7F6;
  --code-band: #EFF1F0;
  --human: #B4620A;
  --human-tint: #FCEFDF;
  --human-band: #FBF5EC;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111716; --fg: #E6ECEA; --muted: #9AA7A3; --line: #34403D; --surface: #18201F;
    --arrow: #A3B0AC; --llm: #4CC2B6; --llm-tint: #13302D; --llm-band: #142220;
    --code-band: #161D1C; --human: #F0A548; --human-tint: #36260F; --human-band: #1F1A12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111716; --fg: #E6ECEA; --muted: #9AA7A3; --line: #34403D; --surface: #18201F;
  --arrow: #A3B0AC; --llm: #4CC2B6; --llm-tint: #13302D; --llm-band: #142220;
  --code-band: #161D1C; --human: #F0A548; --human-tint: #36260F; --human-band: #1F1A12;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
figure { margin: 0 auto; max-width: 1600px; }
.scroll { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 900px; height: auto; }
figcaption { margin-top: 12px; color: var(--muted); font-size: 14px; max-width: 70ch; line-height: 1.5; }

.band-llm { fill: var(--llm-band); }
.band-code { fill: var(--code-band); }
.band-human { fill: var(--human-band); }
.box-code { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.box-llm { fill: var(--llm-tint); stroke: var(--llm); stroke-width: 1.5; }
.box-human { fill: var(--human-tint); stroke: var(--human); stroke-width: 1.5; }
.gate { fill: var(--surface); stroke: var(--llm); stroke-width: 1; stroke-dasharray: 2 3; }

.h1 { font-family: var(--f-display); font-weight: 800; font-size: 30px; fill: var(--fg); }
.sub { font-family: var(--f-body); font-size: 15px; fill: var(--muted); }
.lane { font-family: var(--f-display); font-weight: 800; font-size: 15px; letter-spacing: .12em; }
.lane-d { font-family: var(--f-body); font-size: 12.5px; fill: var(--muted); }
.t { font-family: var(--f-display); font-weight: 700; font-size: 15px; fill: var(--fg); }
.tm { font-family: var(--f-mono); font-weight: 500; font-size: 14.5px; fill: var(--fg); }
.s { font-family: var(--f-body); font-size: 12.5px; fill: var(--muted); }
.gtxt { font-family: var(--f-mono); font-size: 11.5px; fill: var(--llm); }
.lbl { font-family: var(--f-body); font-weight: 500; font-size: 11.5px; fill: var(--arrow); }
.lbl-h { font-family: var(--f-body); font-weight: 500; font-size: 12px; fill: var(--human); }
.c-llm { fill: var(--llm); } .c-code { fill: var(--fg); } .c-human { fill: var(--human); }

.a { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
.a-dash { fill: none; stroke: var(--arrow); stroke-width: 1.6; stroke-dasharray: 6 5; }
.a-h { fill: none; stroke: var(--human); stroke-width: 2.2; }
.halo { fill: none; stroke: var(--code-band); stroke-width: 9; }
.ah { fill: var(--arrow); }
.ah-h { fill: var(--human); }
.rule { stroke: var(--line); stroke-width: 1; }
.big { font-family: var(--f-display); font-weight: 800; font-size: 28px; fill: var(--fg); font-variant-numeric: tabular-nums; }
</style>

<figure>
  <div class="scroll">
  <svg viewBox="0 0 1600 900" role="img" aria-label="Promo Finder architecture: an editor uploads a screenplay pack; code parses it and scores lines with rules; three LLM passes pick promos, build montages and set the posting order; code validates timestamps and ranks; the editor approves or rejects, and those decisions feed back into the ranking weights. If the LLM is off or fails, rules carry the run.">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" class="ah"/>
      </marker>
      <marker id="arr-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" class="ah-h"/>
      </marker>
    </defs>

    <text x="20" y="46" class="h1">Promo Finder · system architecture</text>
    <text x="20" y="76" class="sub">Screenplay pack in, ranked 20–60s promos out. The LLM judges meaning, code owns every timestamp, the editor has the final say.</text>

    <rect x="15" y="100" width="1570" height="230" rx="10" class="band-llm"/>
    <rect x="15" y="345" width="1570" height="255" rx="10" class="band-code"/>
    <rect x="15" y="615" width="1570" height="150" rx="10" class="band-human"/>

    <text x="34" y="132" class="lane c-llm">LLM</text>
    <text x="34" y="152" class="lane-d">judges meaning</text>
    <text x="34" y="169" class="lane-d">3 passes</text>

    <text x="34" y="377" class="lane c-code">CODE</text>
    <text x="34" y="397" class="lane-d">owns numbers</text>
    <text x="34" y="414" class="lane-d">deterministic</text>

    <text x="34" y="647" class="lane c-human">EDITOR</text>
    <text x="34" y="667" class="lane-d">stays in charge</text>

    <rect x="500" y="112" width="680" height="32" rx="6" class="gate"/>
    <text x="840" y="132" text-anchor="middle" class="gtxt">llm.py · swap provider:model · cached · --max-calls cap · 429-only retry · fallback model</text>

    <path d="M210 645 V503" class="a" marker-end="url(#arr)"/>
    <text x="220" y="582" class="lbl">pack .zip / .txt</text>
    <text x="220" y="597" class="lbl">via FastAPI or cli.py</text>

    <path d="M280 440 H318" class="a" marker-end="url(#arr)"/>
    <text x="299" y="431" text-anchor="middle" class="lbl">events</text>

    <path d="M210 400 V182 H498" class="a" marker-end="url(#arr)"/>
    <text x="300" y="174" text-anchor="middle" class="lbl">full script</text>

    <path d="M390 400 V216 H498" class="a" marker-end="url(#arr)"/>
    <text x="444" y="208" text-anchor="middle" class="lbl">candidates</text>
    <path d="M390 285 H498" class="a" marker-end="url(#arr)"/>
    <text x="444" y="277" text-anchor="middle" class="lbl">beats</text>

    <path d="M640 196 H750 V398" class="a" marker-end="url(#arr)"/>
    <text x="695" y="188" text-anchor="middle" class="lbl">picks (JSON)</text>
    <path d="M640 285 H750" class="a"/>
    <text x="695" y="277" text-anchor="middle" class="lbl">montages</text>

    <path d="M460 470 H678" class="a-dash" marker-end="url(#arr)"/>
    <text x="570" y="461" text-anchor="middle" class="lbl">rules fallback</text>
    <text x="570" y="489" text-anchor="middle" class="lbl">LLM off · error · over cap</text>

    <path d="M820 440 H858" class="a" marker-end="url(#arr)"/>
    <text x="839" y="431" text-anchor="middle" class="lbl">kept</text>

    <path d="M930 400 V230 H1038" class="a" marker-end="url(#arr)"/>
    <text x="985" y="222" text-anchor="middle" class="lbl">top 20</text>
    <path d="M1180 230 H1290 V398" class="a" marker-end="url(#arr)"/>
    <text x="1235" y="222" text-anchor="middle" class="lbl">order + why</text>

    <path d="M1000 470 H1218" class="a-dash" marker-end="url(#arr)"/>
    <text x="1110" y="461" text-anchor="middle" class="lbl">no judge: rule order</text>

    <path d="M1290 500 V690 H1398" class="a" marker-end="url(#arr)"/>
    <text x="1345" y="682" text-anchor="middle" class="lbl">ranked list</text>

    <path d="M1470 645 V552" class="a-h" marker-end="url(#arr-h)"/>
    <text x="1480" y="606" class="lbl-h">approvals.json</text>

    <path d="M1540 670 H1568 V402 H1543" class="a" marker-end="url(#arr)"/>
    <text x="1582" y="536" text-anchor="middle" class="lbl" transform="rotate(-90 1582 536)">approved only</text>

    <path d="M1400 520 H930 V503" class="halo"/>
    <path d="M1400 520 H930 V503" class="a-h" marker-end="url(#arr-h)"/>
    <text x="1110" y="540" text-anchor="middle" class="lbl-h">editor decisions re-weight the score</text>

    <rect x="500" y="158" width="140" height="76" rx="8" class="box-llm"/>
    <text x="570" y="182" text-anchor="middle" class="t">LLM pass 1</text>

    <rect x="500" y="250" width="140" height="70" rx="8" class="box-llm"/>
    <text x="570" y="273" text-anchor="middle" class="t">LLM pass 2</text>
    <text x="570" y="292" text-anchor="middle" class="s">1 call · montages</text>
    <text x="570" y="309" text-anchor="middle" class="s">pre-cut beats only</text>

    <rect x="1040" y="180" width="140" height="100" rx="8" class="box-llm"/>
    <text x="1110" y="206" text-anchor="middle" class="t">LLM pass 3</text>
    <text x="1110" y="226" text-anchor="middle" class="s">judge · 1 call</text>
    <text x="1110" y="244" text-anchor="middle" class="s">posting order</text>
    <text x="1110" y="262" text-anchor="middle" class="s">flags weak picks</text>

    <rect x="140" y="400" width="140" height="100" rx="8" class="box-code"/>
    <text x="210" y="428" text-anchor="middle" class="tm">parser.py</text>

    <rect x="320" y="400" width="140" height="100" rx="8" class="box-code"/>
    <text x="390" y="428" text-anchor="middle" class="tm">signals.py</text>
    <text x="390" y="450" text-anchor="middle" class="s">hook + cliff rules</text>
    <text x="390" y="468" text-anchor="middle" class="s">20–60s candidates</text>

    <rect x="680" y="400" width="140" height="100" rx="8" class="box-code"/>
    <text x="750" y="428" text-anchor="middle" class="tm">validate.py</text>
    <text x="750" y="450" text-anchor="middle" class="s">snap to real lines</text>
    <text x="750" y="468" text-anchor="middle" class="s">20–60s · hook ≤ 3s</text>

    <rect x="860" y="400" width="140" height="100" rx="8" class="box-code"/>
    <text x="930" y="428" text-anchor="middle" class="tm">rank.py</text>
    <text x="930" y="450" text-anchor="middle" class="s">75% LLM · 25% rules</text>
    <text x="930" y="468" text-anchor="middle" class="s">− penalties · dedupe</text>

    <rect x="1220" y="400" width="140" height="100" rx="8" class="box-code"/>
    <text x="1290" y="428" text-anchor="middle" class="t">Outputs</text>
    <text x="1290" y="450" text-anchor="middle" class="s">promos json·csv·md</text>
    <text x="1290" y="468" text-anchor="middle" class="s">raw_llm/ audit trail</text>

    <rect x="1400" y="362" width="140" height="80" rx="8" class="box-code"/>
    <text x="1470" y="386" text-anchor="middle" class="tm">export.py</text>
    <text x="1470" y="406" text-anchor="middle" class="s">CMX3600 EDL</text>
    <text x="1470" y="424" text-anchor="middle" class="s">+ ffmpeg cut script</text>

    <rect x="1400" y="470" width="140" height="80" rx="8" class="box-code"/>
    <text x="1470" y="494" text-anchor="middle" class="tm">feedback.py</text>
    <text x="1470" y="514" text-anchor="middle" class="s">precision · reasons</text>
    <text x="1470" y="532" text-anchor="middle" class="s">quality report</text>

    <rect x="140" y="645" width="140" height="90" rx="8" class="box-human"/>
    <text x="210" y="670" text-anchor="middle" class="t">React UI</text>
    <text x="210" y="690" text-anchor="middle" class="s">upload pack</text>
    <text x="210" y="708" text-anchor="middle" class="s">pick model or none</text>

    <rect x="1400" y="645" width="140" height="90" rx="8" class="box-human"/>
    <text x="1470" y="670" text-anchor="middle" class="t">Review cards</text>
    <text x="1470" y="690" text-anchor="middle" class="s">approve / reject</text>
    <text x="1470" y="708" text-anchor="middle" class="s">+ reject reason</text>

    <text x="800" y="700" text-anchor="middle" class="s">EDL opens in Premiere Pro or DaVinci Resolve · ffmpeg script cuts .mp4s</text>

    <line x1="20" y1="790" x2="1580" y2="790" class="rule"/>

    <text x="20" y="836" class="big">52</text>
    <text x="20" y="860" class="s">LLM calls for a 50-episode show</text>

    <text x="300" y="836" class="big">~180K</text>
    <text x="300" y="860" class="s">input tokens per full run</text>

    <text x="580" y="836" class="big">0</text>
    <text x="580" y="860" class="s">calls on a cached rerun</text>

    <text x="860" y="836" class="big">15</text>
    <text x="860" y="860" class="s">offline tests, no API key needed</text>

    <text x="1242" y="830" class="s">rules carry the run if the LLM is off or fails</text>
    <path d="M1180 854 H1230" class="a-h" marker-end="url(#arr-h)"/>
    <text x="1242" y="858" class="s">editor feedback loop</text>
  </svg>
  </div>
  <figcaption>The 16:9 frame is sized for one slide. Code checks and snaps every timestamp the LLM proposes, and the rules alone still produce a ranked list when the model is switched off, fails or runs out of budget.</figcaption>
